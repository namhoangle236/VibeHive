syntax = "proto3";

option csharp_namespace = "AlbumManagementGrpc";

package album;

// the album shape
message Album {
  int32 id = 1;
  string title = 2;
  string artist = 3;
  string genre = 4;
  int32 year = 5;
  bool available = 6;
}

// empty message for when we do not need to send anything
message Empty {}

// just an id, used by get and delete
message AlbumId {
  int32 id = 1;
}

// the service and its methods
service AlbumService {
  rpc AddAlbum (Album) returns (Album);
  rpc GetAlbum (AlbumId) returns (Album);
  rpc UpdateAlbum (Album) returns (Album);
  rpc DeleteAlbum (AlbumId) returns (Empty);
  // stream means the server sends albums back one by one
  rpc ListAlbums (Empty) returns (stream Album);
}